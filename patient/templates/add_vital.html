<!DOCTYPE html>
<html>
<head>
    <title>Add Vitals</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
        }

        .container {
            width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h2 {
            color: #246bfd;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #246bfd;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1255d9;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Add Patient Vitals</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="row">

            <div class="form-group">
                <label>Blood Pressure</label>
                <input
                    type="text"
                    name="blood_pressure"
                    placeholder="e.g. 120/80"
                    required
                >
            </div>

            <div class="form-group">
                <label>Heart Rate (BPM)</label>
                <input
                    type="number"
                    name="heart_rate"
                    placeholder="e.g. 75"
                    required
                >
            </div>

        </div>


        <div class="row">

            <div class="form-group">
                <label>Glucose Level</label>
                <input
                    type="text"
                    name="glucose_level"
                    placeholder="e.g. 90 mg/dL"
                    required
                >
            </div>

            <div class="form-group">
                <label>Body Temperature (°C)</label>
                <input
                    type="number"
                    step="0.01"
                    name="body_temperature"
                    placeholder="e.g. 37.0"
                    required
                >
            </div>

        </div>


        <div class="row">

            <div class="form-group">
                <label>BMI</label>
                <input
                    type="number"
                    step="0.01"
                    name="bmi"
                    placeholder="e.g. 22.5"
                    required
                >
            </div>

            <div class="form-group">
                <label>SpO₂ (%)</label>
                <input
                    type="number"
                    name="spo2"
                    placeholder="e.g. 98"
                    min="0"
                    max="100"
                    required
                >
            </div>

        </div>


        <div class="row">

            <div class="form-group">
                <label>Weight (kg)</label>
                <input
                    type="number"
                    step="0.01"
                    name="weight"
                    placeholder="e.g. 70"
                    required
                >
            </div>

            <div class="form-group">
                <label>FBC Status</label>
                <input
                    type="text"
                    name="fbc_status"
                    placeholder="e.g. Normal"
                >
            </div>

        </div>


        <button type="submit" class="btn">
            Save Vital
        </button>

    </form>

</div>

</body>
</html>
