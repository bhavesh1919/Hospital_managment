{% extends 'base.html' %}
{% load static %}
{% block content%}
<!-- Page Content -->
			<div class="content doctor-content">
				<div class="container">
					<div class="row">
						<div class="col-lg-4 col-xl-3 theiaStickySidebar">
							
							

							{% include 'sidebar.html' %}
							
						</div>
						
						<div class="col-lg-8 col-xl-9">
							<div class="dashboard-header">
								<h3>Change Password</h3>
							</div>
							<form method="POST">

    {% csrf_token %}

    

    <div class="dashboard-card">

        <div class="dashboard-card-body">

            <!-- Old Password -->
            <div class="form-wrap">

                <label class="form-label">
                    Old Password
                </label>

                <input type="password"
                       name="old_password"
                       class="form-control"
                       placeholder="Enter old password"
                       required>

            </div>


            <!-- New Password -->
            <div class="form-wrap">

                <label class="form-label">
                    New Password
                </label>

                <div class="pass-group">

                    <input type="password"
                           name="new_password"
                           class="form-control"
                           placeholder="Enter new password"
                          
                           required>

                    <span class="toggle-password">
                        <i class="fa-solid fa-eye-slash"></i>
                    </span>

                </div>

            </div>


            <!-- Confirm Password -->
            <div class="form-wrap">

                <label class="form-label">
                    Confirm Password
                </label>

                <div class="pass-group">

                    <input type="password"
                           name="confirm_password"
                           class="form-control"
                           placeholder="Confirm new password"
                           
                           required>

                    <span class="toggle-password">
                        <i class="fa-solid fa-eye-slash"></i>
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- Buttons -->
    <div class="form-wrap mt-4 text-end">

        <a href="{% url 'docter_dash' %}"
           class="btn btn-secondary me-2">
            Cancel
        </a>

        <button type="submit"
                class="btn btn-primary">
            Save Changes
        </button>

    </div>

</form>


{% if messages %}
    {% for message in messages %}

        <div class="alert alert-{{ message.tags }} alert-dismissible fade show mt-3"
             role="alert">

            {{ message }}

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>

    {% endfor %}
{% endif %}
						</div>
					</div>

					<!-- Message AFTER GRID -->


				</div>

			</div>		
			<!-- /Page Content -->{% endblock%}
