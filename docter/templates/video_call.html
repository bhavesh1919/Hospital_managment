{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Video Consultation</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .video-header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #ddd;
        }

        .video-header h3 {
            margin: 0;
        }

        .patient-name {
            color: #666;
        }

        #jitsi-container {
            width: 100%;
            height: calc(100vh - 70px);
        }

    </style>

</head>


<body>


    <div class="video-header">

        <div>

            <h3>
                Video Consultation
            </h3>

            <span class="patient-name">

                Patient:
                {{ appointment.patient.fname }}
                {{ appointment.patient.lname }}

            </span>

        </div>

        <div>

            Appointment #Apt{{ appointment.id|stringformat:"04d" }}

        </div>

    </div>


    <div id="jitsi-container"></div>


    <script src="https://meet.jit.si/external_api.js"></script>


    <script>

        const roomName = "{{ room_name }}";

        const domain = "meet.jit.si";


        const options = {

            roomName: roomName,

            width: "100%",

            height: "100%",

            parentNode:
                document.querySelector("#jitsi-container"),

            userInfo: {

                displayName:
                    "{{ request.user.get_full_name|default:request.user.username }}"

            }

        };


        const api = new JitsiMeetExternalAPI(
            domain,
            options
        );


        api.addEventListener(
            "readyToClose",
            function () {

                window.location.href =
                    "{% url 'appointments' %}";

            }
        );

    </script>


</body>

</html>
