{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h4>Add Medical Record</h4>
        </div>

        <div class="card-body">

            <h5>
                Patient:
                {{ patient.fname }} {{ patient.lname }}
            </h5>

            <hr>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}


                <!-- Record Name -->
                <div class="mb-3">
                    <label class="form-label">Record Name</label>

                    <input
                        type="text"
                        name="record_name"
                        class="form-control"
                        placeholder="Enter record name"
                        required>
                </div>


                <!-- Record Date -->
                <div class="mb-3">
                    <label class="form-label">Record Date</label>

                    <input
                        type="date"
                        name="record_date"
                        class="form-control"
                        required>
                </div>


                <!-- Diagnosis -->
                <div class="mb-3">
                    <label class="form-label">Diagnosis</label>

                    <textarea
                        name="diagnosis"
                        class="form-control"
                        rows="4"
                        placeholder="Enter diagnosis"
                        required></textarea>
                </div>


                <!-- Treatment -->
                <div class="mb-3">
                    <label class="form-label">Treatment</label>

                    <textarea
                        name="treatment"
                        class="form-control"
                        rows="4"
                        placeholder="Enter treatment"
                        required></textarea>
                </div>


                <!-- Comments -->
                <div class="mb-3">
                    <label class="form-label">Doctor Comments</label>

                    <textarea
                        name="comments"
                        class="form-control"
                        rows="4"
                        placeholder="Enter comments"></textarea>
                </div>


                <!-- Medical Report -->
                <div class="mb-3">
                    <label class="form-label">Medical Report</label>

                    <input
                        type="file"
                        name="report"
                        class="form-control"
                        accept=".pdf,.jpg,.jpeg,.png">
                </div>

                <div class="mb-3">
    <label class="form-label">Record Name</label>
    <input
        type="text"
        name="record_name"
        class="form-control"
        placeholder="Enter record name"
        required>
</div>

<div class="mb-3">
    <label class="form-label">Record Date</label>
    <input
        type="date"
        name="record_date"
        class="form-control"
        required>
</div>

                <!-- Submit -->
                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Medical Record

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
